<text x="380" y="28" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Control spectrum: bounds of self-improvement</text>
<rect x="80" y="60" width="600" height="55" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="100" y="82" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="start">In the loop</text>
<text x="100" y="102" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start">Human in the loop: push every step yourself</text>
<rect x="80" y="130" width="600" height="55" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="100" y="152" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="start">On the loop</text>
<text x="100" y="172" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start">Human on the loop: watch, tweak the reins occasionally</text>
<rect x="80" y="200" width="600" height="55" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="100" y="222" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="start">Out of the loop?</text>
<text x="100" y="242" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start">Hermes leans: loop spins itself; harness grows itself</text>
<text x="380" y="280" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Open-source &amp; auditable · you draw the line: edit Skills? OK. Rewrite the loop? Careful.</text>

