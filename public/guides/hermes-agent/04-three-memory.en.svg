<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" style="width:100%;max-width:760px;height:auto" role="img" aria-label="Three-layer memory architecture">
<rect x="2" y="2" width="756" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="30" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Three-layer memory: goldfish → old friend</text>
<rect x="50" y="55" width="660" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="70" y="83" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800" text-anchor="start">Layer 1 · Session memory</text>
<text x="70" y="107" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start">What happened? (episodic)  ·  SQLite chat traces · recent context</text>
<rect x="50" y="140" width="660" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="70" y="168" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800" text-anchor="start">Layer 2 · Persistent memory</text>
<text x="70" y="192" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start">Who are you? (semantic)  ·  preferences · toolchain · project habits</text>
<rect x="50" y="225" width="660" height="70" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="70" y="253" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800" text-anchor="start">Layer 3 · Skill memory</text>
<text x="70" y="277" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start">How to do it? (procedural)  ·  ~/.hermes/skills/*.md</text>
<text x="380" y="320" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Optional add-on: Honcho user modeling → deeper than “remembering what you said”</text>

</svg>
