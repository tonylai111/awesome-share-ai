<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" style="width:100%;max-width:760px;height:auto" role="img" aria-label="Core engine slimdown monolith to microkernel">
<rect x="2" y="2" width="756" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="28" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Core engine slimdown: monolith → microkernel</text>
<rect x="50" y="60" width="280" height="140" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="190" y="100" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Before</text>
<text x="190" y="130" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">run_agent.py ≈ 16,000 LOC</text>
<text x="190" y="158" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Everything in one file</text>
<rect x="430" y="60" width="280" height="140" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="570" y="100" fill="#ea580c" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="middle">After v0.15+</text>
<text x="570" y="130" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Core ≈ 3,800 LOC (−76%)</text>
<text x="570" y="158" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Split into 14 modules under agent/</text>
<text x="380" y="240" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Prompts / providers / persistence each own a lane → easier to extend, faster to start</text>

</svg>
