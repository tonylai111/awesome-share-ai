<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" style="width:100%;max-width:760px;height:auto" role="img" aria-label="Five layers of AI engineering">
  <rect x="2" y="2" width="756" height="216" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="380" y="36" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">Five layers - expand outward, do not replace each other</text>
    <rect x="20" y="56" width="136" height="88" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="88" y="88" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle">Prompt</text>
    <text x="88" y="110" fill="#1e3a8a" font-size="11" text-anchor="middle">How to ask</text>
    <text x="88" y="128" fill="#64748b" font-size="10" text-anchor="middle">One instruction</text>
    <rect x="166" y="56" width="136" height="88" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="234" y="88" fill="#065f46" font-size="13" font-weight="700" text-anchor="middle">Context</text>
    <text x="234" y="110" fill="#064e3b" font-size="11" text-anchor="middle">What it sees</text>
    <text x="234" y="128" fill="#64748b" font-size="10" text-anchor="middle">Info environment</text>
    <rect x="312" y="56" width="136" height="88" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="380" y="88" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle">Harness</text>
    <text x="380" y="110" fill="#7c2d12" font-size="11" text-anchor="middle">What it can use</text>
    <text x="380" y="128" fill="#64748b" font-size="10" text-anchor="middle">Tools and bounds</text>
    <rect x="458" y="56" width="136" height="88" rx="10" fill="#fdf2f8" stroke="#ec4899"/>
    <text x="526" y="88" fill="#9d174d" font-size="13" font-weight="700" text-anchor="middle">Loop</text>
    <text x="526" y="110" fill="#831843" font-size="11" text-anchor="middle">How it persists</text>
    <text x="526" y="128" fill="#64748b" font-size="10" text-anchor="middle">Single-agent cycle</text>
    <rect x="604" y="56" width="136" height="88" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="672" y="88" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">Graph</text>
    <text x="672" y="110" fill="#4c1d95" font-size="11" text-anchor="middle">How they collaborate</text>
    <text x="672" y="128" fill="#64748b" font-size="10" text-anchor="middle">Multi-unit relations</text>
    <text x="380" y="178" fill="#475569" font-size="12" text-anchor="middle">Smarter model != more reliable system - outer layers look like an org</text>
    <text x="380" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">A loop is the smallest graph: one node + an edge back to itself</text>
  </g>
</svg>
