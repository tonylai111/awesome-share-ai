<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" style="width:100%;max-width:760px;height:auto" role="img" aria-label="Node Edge State">
  <rect x="2" y="2" width="756" height="276" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif">
    <text x="380" y="34" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">Graph 三件套：节点 · 边 · 状态</text>
    <rect x="28" y="56" width="210" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="133" y="88" fill="#1e40af" font-size="16" font-weight="800" text-anchor="middle">节点 Node</text>
    <text x="133" y="116" fill="#1e3a8a" font-size="12" text-anchor="middle">做事的执行单元</text>
    <text x="133" y="140" fill="#334155" font-size="11.5" text-anchor="middle">Agent / 代码 / 工具 / 人</text>
    <text x="133" y="162" fill="#64748b" font-size="11" text-anchor="middle">一事一责 · 边界清晰</text>
    <text x="133" y="184" fill="#64748b" font-size="11" text-anchor="middle">能用代码就别用模型</text>
    <rect x="275" y="56" width="210" height="150" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <text x="380" y="88" fill="#065f46" font-size="16" font-weight="800" text-anchor="middle">边 Edge</text>
    <text x="380" y="116" fill="#064e3b" font-size="12" text-anchor="middle">交接与路由契约</text>
    <text x="380" y="140" fill="#334155" font-size="11.5" text-anchor="middle">字段 · 权限 · 失败语义</text>
    <text x="380" y="162" fill="#64748b" font-size="11" text-anchor="middle">条件分支 / 扇出扇入</text>
    <text x="380" y="184" fill="#64748b" font-size="11" text-anchor="middle">「然后」≠ 真依赖</text>
    <rect x="522" y="56" width="210" height="150" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="627" y="88" fill="#9a3412" font-size="16" font-weight="800" text-anchor="middle">状态 State</text>
    <text x="627" y="116" fill="#7c2d12" font-size="12" text-anchor="middle">沿边流动的共享记录</text>
    <text x="627" y="140" fill="#334155" font-size="11.5" text-anchor="middle">版本 · 检查点 · 证据</text>
    <text x="627" y="162" fill="#64748b" font-size="11" text-anchor="middle">可暂停 / 可恢复</text>
    <text x="627" y="184" fill="#64748b" font-size="11" text-anchor="middle">可局部重做</text>
    <text x="380" y="244" fill="#475569" font-size="13" text-anchor="middle">多 Agent 描述「有几个员工」· Graph Engineering 设计「怎样交接与追责」</text>
    <text x="380" y="266" fill="#94a3b8" font-size="11" text-anchor="middle">好的边有 Schema；好的状态让失败可恢复</text>
  </g>
</svg>
