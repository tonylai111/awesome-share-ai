<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" style="width:100%;max-width:760px;height:auto" role="img" aria-label="Core loop: goal, attempt, feedback, self-correct, verify, done"><defs><marker id="ah-core" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"></path></marker><marker id="ah-pass" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#10b981"></path></marker><marker id="ah-fail" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ef4444"></path></marker></defs><rect x="2" y="2" width="756" height="266" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><rect x="40" y="34" width="140" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"></rect><text x="110" y="60" fill="#3730a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">GOAL</text><text x="110" y="78" fill="#4f46e5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" text-anchor="middle">testable &quot;done&quot;</text><rect x="310" y="34" width="140" height="64" rx="10" fill="#ecfeff" stroke="#22d3ee"></rect><text x="380" y="60" fill="#0e7490" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">ATTEMPT</text><text x="380" y="78" fill="#0e7490" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" text-anchor="middle">the agent acts</text><rect x="580" y="34" width="140" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b"></rect><text x="650" y="60" fill="#92400e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">FEEDBACK</text><text x="650" y="78" fill="#92400e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" text-anchor="middle">tests · types · errors</text><rect x="40" y="170" width="140" height="64" rx="10" fill="#dcfce7" stroke="#10b981"></rect><text x="110" y="196" fill="#065f46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">DONE</text><text x="110" y="214" fill="#047857" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" text-anchor="middle">verifier passed</text><rect x="310" y="170" width="140" height="64" rx="10" fill="#dcfce7" stroke="#10b981"></rect><text x="380" y="192" fill="#065f46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">VERIFY</text><text x="380" y="210" fill="#047857" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" text-anchor="middle">separate context</text><text x="380" y="223" fill="#047857" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" text-anchor="middle">+ rubric</text><rect x="580" y="170" width="140" height="64" rx="10" fill="#ede9fe" stroke="#8b5cf6"></rect><text x="650" y="192" fill="#5b21b6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">SELF-CORRECT</text><text x="650" y="210" fill="#6d28d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" text-anchor="middle">diagnose, change</text><text x="650" y="223" fill="#6d28d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" text-anchor="middle">approach</text><line x1="180" y1="66" x2="308" y2="66" stroke="#64748b" stroke-width="2" marker-end="url(#ah-core)"></line><line x1="450" y1="66" x2="578" y2="66" stroke="#64748b" stroke-width="2" marker-end="url(#ah-core)"></line><line x1="650" y1="98" x2="650" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#ah-core)"></line><line x1="580" y1="202" x2="452" y2="202" stroke="#64748b" stroke-width="2" marker-end="url(#ah-core)"></line><line x1="310" y1="202" x2="182" y2="202" stroke="#10b981" stroke-width="2.4" marker-end="url(#ah-pass)"></line><text x="246" y="192" fill="#059669" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PASS</text><line x1="380" y1="168" x2="380" y2="100" stroke="#ef4444" stroke-width="2.4" marker-end="url(#ah-fail)"></line><text x="412" y="138" fill="#dc2626" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FAIL → retry</text></svg>