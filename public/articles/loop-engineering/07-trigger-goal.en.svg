<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" style="width:100%;max-width:720px;height:auto" role="img" aria-label="Trigger to engine to verifiable goal"><defs><marker id="ah-t" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"></path></marker></defs><rect x="2" y="2" width="756" height="466" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><g font-family="ui-sans-serif, system-ui, sans-serif"><rect x="130" y="22" width="500" height="100" rx="12" fill="#ecfeff" stroke="#22d3ee"></rect><text x="380" y="44" fill="#0e7490" font-size="13" font-weight="800" text-anchor="middle">TRIGGERS — pick one</text><text x="380" y="66" fill="#0e7490" font-size="12" text-anchor="middle">• a pull request opening • a failing CI run • a daily / scheduled tick</text><text x="380" y="86" fill="#0e7490" font-size="12" text-anchor="middle">• a Slack message • a manual comment or one-off &quot;force&quot; prompt</text><text x="380" y="108" fill="#0e7490" font-size="11" text-anchor="middle">whatever wakes the loop up</text><line x1="380" y1="122" x2="380" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#ah-t)"></line><text x="408" y="138" fill="#475569" font-size="11" font-weight="600" text-anchor="start">starts</text><rect x="130" y="148" width="500" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"></rect><text x="380" y="172" fill="#3730a3" font-size="13" font-weight="800" text-anchor="middle">THE LOOP ENGINE</text><text x="380" y="194" fill="#4f46e5" font-size="12" text-anchor="middle">look at state → choose next action → act → check result → iterate or stop</text><text x="380" y="220" fill="#4f46e5" font-size="11.5" text-anchor="middle">built from: automations · worktrees · skills · connectors · sub-agents · memory</text><line x1="380" y1="240" x2="380" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#ah-t)"></line><text x="430" y="256" fill="#475569" font-size="11" font-weight="600" text-anchor="start">checks itself against</text><rect x="130" y="266" width="500" height="104" rx="12" fill="#dcfce7" stroke="#10b981"></rect><text x="380" y="288" fill="#065f46" font-size="13" font-weight="800" text-anchor="middle">VERIFIABLE GOAL — pick the right strength</text><text x="160" y="312" fill="#047857" font-size="12" text-anchor="start">strict → &quot;all tests pass and CI is green&quot; (deterministic)</text><text x="160" y="332" fill="#047857" font-size="12" text-anchor="start">medium → a reviewer model checks the UI matches the spec</text><text x="160" y="352" fill="#047857" font-size="12" text-anchor="start">soft → a predefined list of subjective criteria</text><rect x="80" y="400" width="300" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8"></rect><text x="230" y="422" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">goal met → stop, ship, update state</text><text x="230" y="438" fill="#64748b" font-size="11" text-anchor="middle">not met → iterate</text><rect x="400" y="400" width="280" height="48" rx="10" fill="#fee2e2" stroke="#ef4444"></rect><text x="540" y="421" fill="#991b1b" font-size="11.5" font-weight="700" text-anchor="middle">no check at all?</text><text x="540" y="438" fill="#b91c1c" font-size="11" text-anchor="middle">a very confident token furnace</text><line x1="300" y1="370" x2="240" y2="398" stroke="#64748b" stroke-width="2" marker-end="url(#ah-t)"></line><line x1="460" y1="370" x2="520" y2="398" stroke="#ef4444" stroke-width="2" marker-end="url(#ah-t)"></line></g></svg>