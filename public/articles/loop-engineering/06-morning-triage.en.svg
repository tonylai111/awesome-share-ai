<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" style="width:100%;max-width:720px;height:auto" role="img" aria-label="The morning triage loop, end to end"><defs><marker id="ah-m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"></path></marker><marker id="ah-mp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#10b981"></path></marker><marker id="ah-mf" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b"></path></marker><marker id="ah-mr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ef4444"></path></marker></defs><rect x="2" y="2" width="756" height="616" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><g font-family="ui-sans-serif, system-ui, sans-serif"><rect x="230" y="24" width="300" height="52" rx="10" fill="#ecfeff" stroke="#22d3ee"></rect><text x="380" y="46" fill="#0e7490" font-size="13" font-weight="700" text-anchor="middle">TRIGGER — every morning (schedule)</text><text x="380" y="64" fill="#0e7490" font-size="11" text-anchor="middle">no prompt from you</text><rect x="210" y="100" width="340" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8"></rect><text x="380" y="130" fill="#334155" font-size="12.5" text-anchor="middle">read CI failures + open issues + recent commits</text><rect x="230" y="174" width="300" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8"></rect><text x="380" y="204" fill="#334155" font-size="12.5" text-anchor="middle">write STATE.md — what&#x27;s worth doing</text><rect x="200" y="248" width="360" height="50" rx="10" fill="#ffe4e6" stroke="#f43f5e"></rect><text x="380" y="270" fill="#9f1239" font-size="12.5" text-anchor="middle">pick one issue → open a separate worktree</text><text x="380" y="287" fill="#9f1239" font-size="12.5" text-anchor="middle">→ draft agent writes a fix</text><rect x="210" y="322" width="340" height="50" rx="10" fill="#ede9fe" stroke="#8b5cf6"></rect><text x="380" y="344" fill="#5b21b6" font-size="12.5" text-anchor="middle">reviewer sub-agent: check vs. skills</text><text x="380" y="361" fill="#5b21b6" font-size="12.5" text-anchor="middle">+ run the tests</text><line x1="380" y1="76" x2="380" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#ah-m)"></line><line x1="380" y1="150" x2="380" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#ah-m)"></line><line x1="380" y1="224" x2="380" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#ah-m)"></line><line x1="380" y1="298" x2="380" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#ah-m)"></line><line x1="300" y1="372" x2="160" y2="440" stroke="#10b981" stroke-width="2.2" marker-end="url(#ah-mp)"></line><text x="200" y="404" fill="#059669" font-size="11.5" font-weight="700" text-anchor="middle">tests pass</text><line x1="470" y1="372" x2="600" y2="430" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#ah-mf)"></line><text x="565" y="404" fill="#b45309" font-size="11.5" font-weight="700" text-anchor="middle">tests fail</text><rect x="40" y="442" width="250" height="58" rx="10" fill="#dcfce7" stroke="#10b981"></rect><text x="165" y="467" fill="#065f46" font-size="13" font-weight="700" text-anchor="middle">open PR</text><text x="165" y="485" fill="#047857" font-size="11.5" text-anchor="middle">+ update the ticket</text><rect x="470" y="432" width="260" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b"></rect><text x="600" y="455" fill="#92400e" font-size="12.5" font-weight="700" text-anchor="middle">feed the error back ×1–2</text><text x="600" y="473" fill="#92724e" font-size="11" text-anchor="middle">self-correct, re-run</text><path d="M470,470 C360,486 300,500 290,486" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-mp)"></path><text x="370" y="520" fill="#059669" font-size="11" font-weight="600" text-anchor="middle">now passing → PR</text><line x1="600" y1="488" x2="600" y2="540" stroke="#ef4444" stroke-width="2.2" marker-end="url(#ah-mr)"></line><text x="668" y="518" fill="#dc2626" font-size="11" font-weight="700" text-anchor="middle">still stuck</text><rect x="455" y="542" width="290" height="56" rx="10" fill="#fee2e2" stroke="#ef4444"></rect><text x="600" y="567" fill="#991b1b" font-size="12.5" font-weight="700" text-anchor="middle">stop · escalate</text><text x="600" y="585" fill="#b91c1c" font-size="11.5" text-anchor="middle">put the problem in your inbox</text></g></svg>