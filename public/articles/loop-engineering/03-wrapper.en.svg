<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="width:100%;max-width:680px;height:auto" role="img" aria-label="An agent is an LLM inside a loop inside a wrapper"><rect x="2" y="2" width="696" height="296" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><rect x="22" y="24" width="656" height="254" rx="14" fill="#f8fafc" stroke="#94a3b8"></rect><text x="350" y="46" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">WRAPPER</text><text x="350" y="64" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" text-anchor="middle">tools (files · shell · web · git) · memory · prompting · routing · stopping criteria · retries</text><rect x="120" y="84" width="460" height="174" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"></rect><text x="350" y="106" fill="#3730a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">LOOP</text><text x="350" y="126" fill="#4f46e5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" text-anchor="middle">while not done: think → choose tool → act → observe → update plan → repeat</text><rect x="265" y="150" width="170" height="88" rx="12" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"></rect><text x="350" y="190" fill="#065f46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">LLM</text><text x="350" y="212" fill="#047857" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">the engine</text></svg>