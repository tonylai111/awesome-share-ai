<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" style="width:100%;max-width:720px;height:auto" role="img" aria-label="该不该做成循环？起飞检查清单"><rect x="2" y="2" width="756" height="346" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><text x="34" y="40" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">该不该做成循环？</text><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif"><g><rect x="34" y="64" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,77 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="76" fill="#0f172a" font-size="13.5" font-weight="600">这事是否至少每周重复一次？</text><text x="74" y="94" fill="#dc2626" font-size="11.5">否 → 搭建成本永远回不来。</text></g><g><rect x="34" y="118" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,131 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="130" fill="#0f172a" font-size="13.5" font-weight="600">测试/类型检查/构建/linter 能拒掉坏输出吗？</text><text x="74" y="148" fill="#dc2626" font-size="11.5">否 → Agent 在给自己作业打分。</text></g><g><rect x="34" y="172" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,185 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="184" fill="#0f172a" font-size="13.5" font-weight="600">Agent 能否跑它改过的代码？</text><text x="74" y="202" fill="#dc2626" font-size="11.5">否 → 迭代是盲的。</text></g><g><rect x="34" y="226" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,239 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="238" fill="#0f172a" font-size="13.5" font-weight="600">设了硬停止（token/轮次/时间）吗？</text><text x="74" y="256" fill="#dc2626" font-size="11.5">否 → 会一直跑到有人发现账单。</text></g><g><rect x="34" y="280" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,293 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="292" fill="#0f172a" font-size="13.5" font-weight="600">合并/部署/改依赖前有人审吗？</text><text x="74" y="310" fill="#dc2626" font-size="11.5">否 → 不可逆操作没有审批闸门。</text></g></g></svg>