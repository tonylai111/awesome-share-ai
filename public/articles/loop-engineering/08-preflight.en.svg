<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" style="width:100%;max-width:720px;height:auto" role="img" aria-label="Should this be a loop? pre-flight checklist"><rect x="2" y="2" width="756" height="346" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><text x="34" y="40" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Should this be a loop?</text><g font-family="ui-sans-serif, system-ui, sans-serif"><g><rect x="34" y="64" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,77 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="76" fill="#0f172a" font-size="13.5" font-weight="600">Does the task recur at least weekly?</text><text x="74" y="94" fill="#dc2626" font-size="11.5">No → setup cost never amortizes.</text></g><g><rect x="34" y="118" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,131 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="130" fill="#0f172a" font-size="13.5" font-weight="600">Can a test / type check / build / linter reject bad output?</text><text x="74" y="148" fill="#dc2626" font-size="11.5">No → the agent grades its own homework.</text></g><g><rect x="34" y="172" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,185 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="184" fill="#0f172a" font-size="13.5" font-weight="600">Can the agent run the code it changes?</text><text x="74" y="202" fill="#dc2626" font-size="11.5">No → iteration is blind.</text></g><g><rect x="34" y="226" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,239 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="238" fill="#0f172a" font-size="13.5" font-weight="600">Hard stop set (token budget, iteration count, time limit)?</text><text x="74" y="256" fill="#dc2626" font-size="11.5">No → it runs until someone notices the bill.</text></g><g><rect x="34" y="280" width="26" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"></rect><path d="M40,293 l5,6 l9,-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="74" y="292" fill="#0f172a" font-size="13.5" font-weight="600">Does a human review before merge / deploy / dependency changes?</text><text x="74" y="310" fill="#dc2626" font-size="11.5">No → irreversible actions have no approval gate.</text></g></g></svg>