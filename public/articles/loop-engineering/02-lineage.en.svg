<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" style="width:100%;max-width:760px;height:auto" role="img" aria-label="Lineage: ReAct to AutoGPT to Ralph to goal"><defs><marker id="ah-line" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"></path></marker></defs><rect x="2" y="2" width="756" height="196" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><rect x="22" y="64" width="150" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"></rect><text x="97" y="92" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ReAct</text><text x="97" y="110" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">reason → act →</text><text x="97" y="124" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">observe, repeat</text><rect x="208" y="64" width="150" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b"></rect><text x="283" y="92" fill="#92400e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">AutoGPT</text><text x="283" y="110" fill="#92724e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">self-prompts to</text><text x="283" y="124" fill="#92724e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">a goal (+ rabbit holes)</text><rect x="394" y="64" width="150" height="72" rx="10" fill="#ecfeff" stroke="#22d3ee"></rect><text x="469" y="92" fill="#0e7490" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Ralph loop</text><text x="469" y="110" fill="#3f7a8a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">same prompt, fresh</text><text x="469" y="124" fill="#3f7a8a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">context, forced amnesia</text><rect x="580" y="64" width="158" height="72" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"></rect><text x="659" y="92" fill="#3730a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">/goal (now)</text><text x="659" y="110" fill="#3730a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">stop = &quot;actually done,&quot;</text><text x="659" y="124" fill="#3730a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">verified vs. criteria</text><line x1="172" y1="100" x2="206" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#ah-line)"></line><line x1="358" y1="100" x2="392" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#ah-line)"></line><line x1="544" y1="100" x2="578" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#ah-line)"></line><text x="380" y="34" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">The agent loop, productized over time</text><text x="380" y="172" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" text-anchor="middle">2022–2023 ───────────────────────────────────────────────▶ now</text></svg>