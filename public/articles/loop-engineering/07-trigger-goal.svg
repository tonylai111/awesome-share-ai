<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" style="width:100%;max-width:720px;height:auto" role="img" aria-label="触发 → 循环引擎 → 可验证目标"><defs><marker id="ah-t" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"></path></marker></defs><rect x="2" y="2" width="756" height="466" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif"><rect x="130" y="22" width="500" height="100" rx="12" fill="#ecfeff" stroke="#22d3ee"></rect><text x="380" y="44" fill="#0e7490" font-size="13" font-weight="800" text-anchor="middle">触发器 — 选一种</text><text x="380" y="66" fill="#0e7490" font-size="12" text-anchor="middle">• PR 打开 · CI 失败 · 每日/定时触发</text><text x="380" y="86" fill="#0e7490" font-size="12" text-anchor="middle">• Slack 消息 · 手动评论或一次性强制提示</text><text x="380" y="108" fill="#0e7490" font-size="11" text-anchor="middle">任何唤醒循环的信号</text><line x1="380" y1="122" x2="380" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#ah-t)"></line><text x="408" y="138" fill="#475569" font-size="11" font-weight="600" text-anchor="start">启动</text><rect x="130" y="148" width="500" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"></rect><text x="380" y="172" fill="#3730a3" font-size="13" font-weight="800" text-anchor="middle">循环引擎</text><text x="380" y="194" fill="#4f46e5" font-size="12" text-anchor="middle">看状态 → 选下一步 → 行动 → 检查结果 → 迭代或停止</text><text x="380" y="220" fill="#4f46e5" font-size="11.5" text-anchor="middle">由：自动化·Worktrees·Skills·连接器·子Agent·记忆 组成</text><line x1="380" y1="240" x2="380" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#ah-t)"></line><text x="430" y="256" fill="#475569" font-size="11" font-weight="600" text-anchor="start">对照检查</text><rect x="130" y="266" width="500" height="104" rx="12" fill="#dcfce7" stroke="#10b981"></rect><text x="380" y="288" fill="#065f46" font-size="13" font-weight="800" text-anchor="middle">可验证目标 — 选对强度</text><text x="160" y="312" fill="#047857" font-size="12" text-anchor="start">严格 →「全部测试通过且 CI 全绿」（确定）</text><text x="160" y="332" fill="#047857" font-size="12" text-anchor="start">中等 → 审查模型检查 UI 是否符合规格</text><text x="160" y="352" fill="#047857" font-size="12" text-anchor="start">宽松 → 一组预定义主观标准</text><rect x="80" y="400" width="300" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8"></rect><text x="230" y="422" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">达标 → 停止、交付、更新状态</text><text x="230" y="438" fill="#64748b" font-size="11" text-anchor="middle">未达标 → 继续迭代</text><rect x="400" y="400" width="280" height="48" rx="10" fill="#fee2e2" stroke="#ef4444"></rect><text x="540" y="421" fill="#991b1b" font-size="11.5" font-weight="700" text-anchor="middle">完全没有检查？</text><text x="540" y="438" fill="#b91c1c" font-size="11" text-anchor="middle">一台很自信的 Token 熔炉</text><line x1="300" y1="370" x2="240" y2="398" stroke="#64748b" stroke-width="2" marker-end="url(#ah-t)"></line><line x1="460" y1="370" x2="520" y2="398" stroke="#ef4444" stroke-width="2" marker-end="url(#ah-t)"></line></g></svg>