<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" style="width:100%;max-width:720px;height:auto" role="img" aria-label="三种硬停止控制"><rect x="2" y="2" width="756" height="166" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif"><rect x="26" y="40" width="225" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b"></rect><text x="138" y="70" fill="#92400e" font-size="13.5" font-weight="800" text-anchor="middle">最大迭代次数</text><text x="138" y="98" fill="#92724e" font-size="11.5" text-anchor="middle">达不到目标的循环</text><text x="138" y="114" fill="#92724e" font-size="11.5" text-anchor="middle">就该停止尝试</text><rect x="268" y="40" width="225" height="100" rx="12" fill="#ffe4e6" stroke="#f43f5e"></rect><text x="380" y="64" fill="#9f1239" font-size="13.5" font-weight="800" text-anchor="middle">无进展检测</text><text x="380" y="84" fill="#be123c" font-size="11" text-anchor="middle">最重要的一项</text><text x="380" y="104" fill="#be123c" font-size="11.5" text-anchor="middle">检测「我们并没有</text><text x="380" y="120" fill="#be123c" font-size="11.5" text-anchor="middle">更接近」并叫停</text><rect x="510" y="40" width="225" height="100" rx="12" fill="#dcfce7" stroke="#10b981"></rect><text x="622" y="70" fill="#065f46" font-size="13.5" font-weight="800" text-anchor="middle">Token / 美元上限</text><text x="622" y="98" fill="#047857" font-size="11.5" text-anchor="middle">硬性财务刹车，</text><text x="622" y="114" fill="#047857" font-size="11.5" text-anchor="middle">最好按子 Agent 计</text></g></svg>