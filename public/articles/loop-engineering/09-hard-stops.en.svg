<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" style="width:100%;max-width:720px;height:auto" role="img" aria-label="Three hard-stop controls"><rect x="2" y="2" width="756" height="166" rx="14" fill="#ffffff" stroke="#e2e8f0"></rect><g font-family="ui-sans-serif, system-ui, sans-serif"><rect x="26" y="40" width="225" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b"></rect><text x="138" y="70" fill="#92400e" font-size="13.5" font-weight="800" text-anchor="middle">Max iterations</text><text x="138" y="98" fill="#92724e" font-size="11.5" text-anchor="middle">a loop that can&#x27;t reach</text><text x="138" y="114" fill="#92724e" font-size="11.5" text-anchor="middle">its goal stops trying</text><rect x="268" y="40" width="225" height="100" rx="12" fill="#ffe4e6" stroke="#f43f5e"></rect><text x="380" y="64" fill="#9f1239" font-size="13.5" font-weight="800" text-anchor="middle">No-progress detection</text><text x="380" y="84" fill="#be123c" font-size="11" text-anchor="middle">the most important one</text><text x="380" y="104" fill="#be123c" font-size="11.5" text-anchor="middle">detect &quot;we&#x27;re not getting</text><text x="380" y="120" fill="#be123c" font-size="11.5" text-anchor="middle">closer&quot; and halt</text><rect x="510" y="40" width="225" height="100" rx="12" fill="#dcfce7" stroke="#10b981"></rect><text x="622" y="70" fill="#065f46" font-size="13.5" font-weight="800" text-anchor="middle">Token / $ ceiling</text><text x="622" y="98" fill="#047857" font-size="11.5" text-anchor="middle">a hard financial stop,</text><text x="622" y="114" fill="#047857" font-size="11.5" text-anchor="middle">ideally per sub-agent</text></g></svg>